<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}Pyxis OS</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  {{ $canonical := .Permalink }}{{ with .Params.redirect }}{{ $canonical = . | absURL }}{{ end }}
  <link rel="canonical" href="{{ $canonical }}">
  <link rel="icon" type="image/png" href="/assets/pyxis-mark.png">
  <link rel="stylesheet" href="/assets/site.css">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ $canonical }}">
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }} · {{ end }}Pyxis OS">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:image" content="https://pyxis.nexus/assets/jvm-on-vela.png">
  <meta name="twitter:card" content="summary_large_image">
  {{ with .Params.redirect }}<meta http-equiv="refresh" content="0; url={{ . }}"><meta name="robots" content="noindex">{{ end }}
</head>
<body>
<main{{ if .IsHome }} class="home"{{ end }}>
  <header class="site-header">
    <a class="site-brand" href="/" aria-label="Pyxis home"><img src="/assets/pyxis-logo.svg" width="640" height="680" alt="Pyxis"></a>
    {{ partial "navigation.html" . }}
    <a class="site-source" href="https://github.com/Pyxis-OS" aria-label="Source on GitHub" title="Source on GitHub">
      <!-- GitHub Octicons mark-github-16, MIT; /licenses/github-mark.txt. -->
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    </a>
    {{ if .IsHome }}<h1>Pyxis OS</h1>{{ end }}
  </header>
  {{ block "main" . }}{{ end }}
  <footer>pyxis.nexus{{ if not .IsHome }} · <a href="/">Home</a>{{ end }}</footer>
</main>
</body>
</html>
