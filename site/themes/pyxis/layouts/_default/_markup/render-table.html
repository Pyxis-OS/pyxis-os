<div class="table-scroll" role="region" aria-label="{{ .Page.Title }} table" tabindex="0">
  <table>
    <thead>
      {{ range .THead }}<tr>
        {{ range . }}<th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}
      </tr>{{ end }}
    </thead>
    <tbody>
      {{ range .TBody }}<tr>
        {{ range . }}<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}
      </tr>{{ end }}
    </tbody>
  </table>
</div>
