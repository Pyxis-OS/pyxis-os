[build]
build = "x86_64-unknown-linux-gnu"
host = ["x86_64-unknown-linux-gnu"]
target = ["x86_64-unknown-linux-gnu"]
build-stage = 2
jobs = 4
bootstrap-cache-path = "/absolute/rust-bootstrap-cache"
docs = false
compiler-docs = false
extended = false
tools = []
submodules = false
locked-deps = true
optimized-compiler-builtins = false
sanitizers = false
profiler = false
full-bootstrap = true
description = "pyxis"

[llvm]
download-ci-llvm = true
assertions = false

[rust]
# Cargo declares std as dylib+rlib; the static Pyxis target drops dylib.
deny-warnings = false
channel = "nightly"
download-rustc = false
lto = "off"
codegen-units = 4
codegen-units-std = 4
incremental = false
codegen-backends = ["llvm"]
lld = false
llvm-tools = false
llvm-bitcode-linker = false

[target.x86_64-unknown-linux-gnu]
cc = "/usr/bin/clang"
cxx = "/usr/bin/clang++"
linker = "/usr/bin/clang"

[target.x86_64-unknown-pyxis]
no-std = false
cc = "/absolute/pyxis-cross/bin/x86_64-unknown-pyxis-clang"
cxx = "/absolute/pyxis-cross/bin/x86_64-unknown-pyxis-clang++"
ar = "/absolute/pyxis-cross/bin/llvm-ar"
ranlib = "/absolute/pyxis-cross/bin/llvm-ranlib"
rustflags = ["-Cembed-bitcode=no"]
