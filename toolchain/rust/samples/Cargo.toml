[workspace]
resolver = "3"
members = ["runtime", "hello", "scene", "raster", "raster-host", "std-main"]
default-members = ["raster-host"]

[patch.crates-io]
libc = { git = "https://git.internal/PyxisOS/pyxis-libc.git", rev = "94498eae9e79ef076eded365fcd9625f17f63377" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = false
debug = 2
