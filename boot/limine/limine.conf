# PYXIS_BOOT_MENU_TIMEOUT
serial: yes

/Pyxis OS (Caelum)
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
# PYXIS_NORMAL_COMMAND_LINE

/Pyxis OS (rescue)
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
# PYXIS_RESCUE_COMMAND_LINE

/Install Pyxis
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
  cmdline: init=boot://boot-init.pxe boot.install=1

/Inspect FAT32 (read-only)
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
  cmdline: init=boot://init-fat32-inspect.pxe boot.install=1

/Write scratch FAT32
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
  cmdline: init=boot://init-fat32-write.pxe boot.install=1

/Browse scratch FAT32 (native read-only)
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
  cmdline: init=boot://init-fat32-mount.pxe boot.install=1

/Write scratch FAT32 (native mounted)
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
  cmdline: init=boot://init-fat32-mount-write.pxe boot.install=1

/Browse boot ESP (native read-only)
  protocol: limine
  path: $boot():/boot/caelum.elf.gz
  module_path: $boot():/boot/initrd.cpio.gz
  paging_mode: 4level
  kaslr: no
  cmdline: init=boot://init-fat32-mount.pxe
