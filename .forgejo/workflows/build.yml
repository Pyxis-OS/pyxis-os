name: Build Pyxis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BUILDER_IMAGE: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-49e2c1a

jobs:
  # A pull request touching only docs/ or Markdown files skips the expensive
  # steps below. The jobs still run and succeed, so required checks report.
  # Pushes to main and manual runs always build; detection failure builds too.
  changes:
    name: changes
    runs-on: pyxis
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-49e2c1a
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
      - name: Detect documentation-only pull requests
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && [ -n "$BASE_SHA" ] &&
             git fetch --no-tags origin "$BASE_SHA" &&
             changed=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "$changed"
            if [ -n "$changed" ] &&
               ! printf '%s\n' "$changed" | grep -v -E '^docs/|\.md$' >/dev/null; then
              code=false
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # A pull request that changes a submodule pin must pin a commit that contains
  # that repository's main, so merged dependency work is not rolled back, and
  # that has been published. Unchanged pins are not checked. See
  # docs/development/sdk-and-repositories.md.
  pins:
    name: pins
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: pyxis
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-49e2c1a
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed submodule pins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
          exec scripts/check-submodule-pins.sh "$BASE_SHA" "$HEAD_SHA"

  filesystem:
    name: filesystem
    needs: changes
    runs-on: pyxis-fs-ram
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-49e2c1a
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        if: ${{ needs.changes.outputs.code == 'true' }}
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build pinned npfs format and host tools
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            build_uid=$(id -u nobody)
            build_gid=$(id -g nobody)
            chown -hR "$build_uid:$build_gid" .
            exec setpriv --reuid="$build_uid" --regid="$build_gid" --clear-groups \
              --no-new-privs env HOME=/tmp make -j16 fs-tools
          fi
          exec make -j16 fs-tools

  build:
    needs: [changes, filesystem, pins]
    if: ${{ always() }}
    runs-on: pyxis
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-49e2c1a
    steps:
      - name: Require change detection, pin and pinned filesystem validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          PINS_RESULT: ${{ needs.pins.result }}
        run: |
          test "$CHANGES_RESULT" = success && test "$FILESYSTEM_RESULT" = success
          # The pin check runs only for pull requests.
          test "$PINS_RESULT" = success || test "$PINS_RESULT" = skipped
      - name: Report a documentation-only pull request
        if: ${{ needs.changes.outputs.code != 'true' }}
        run: echo "Only docs/ or Markdown files changed; image build skipped."
      - uses: https://data.forgejo.org/actions/checkout@v4
        if: ${{ needs.changes.outputs.code == 'true' }}
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.fetchJobs
          GIT_CONFIG_VALUE_0: '8'
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host configuration dependency
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --break-system-packages -r requirements.txt
      - name: Build image and component bundles
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            build_uid=$(id -u nobody)
            build_gid=$(id -g nobody)
            chown -hR "$build_uid:$build_gid" .
            exec setpriv --reuid="$build_uid" --regid="$build_gid" --clear-groups \
              --no-new-privs env HOME=/tmp \
              make -j16 image bundle-kernel bundle-sdk bundle-ports bundle-userspace
          fi
          exec make -j16 image bundle-kernel bundle-sdk bundle-ports bundle-userspace
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: ${{ needs.changes.outputs.code == 'true' }}
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-kernel
          path: build/bundles/kernel.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: ${{ needs.changes.outputs.code == 'true' }}
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-sdk
          path: build/bundles/sdk.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: ${{ needs.changes.outputs.code == 'true' }}
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-userland
          path: build/bundles/userspace.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: ${{ needs.changes.outputs.code == 'true' }}
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-ports
          path: build/bundles/ports.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: ${{ needs.changes.outputs.code == 'true' }}
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-image
          path: |
            build/pyxis.iso
            build/caelum.elf
          if-no-files-found: error
