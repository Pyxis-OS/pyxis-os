name: Build Pyxis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BUILDER_IMAGE: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-41ab604

jobs:
  filesystem:
    name: filesystem
    runs-on: pyxis-fs-ram
    timeout-minutes: 5
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-41ab604
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build pinned npfs format and host tools
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            build_uid=$(id -u nobody)
            build_gid=$(id -g nobody)
            chown -hR "$build_uid:$build_gid" .
            exec setpriv --reuid="$build_uid" --regid="$build_gid" --clear-groups \
              --no-new-privs env HOME=/tmp make -j16 fs-tools
          fi
          exec make -j16 fs-tools

  build:
    needs: filesystem
    if: ${{ always() }}
    runs-on: pyxis
    container:
      image: git.internal/pyxisos/pyxis-builder:pyxis-llvm23.1.3-41ab604
    steps:
      - name: Require pinned filesystem validation
        env:
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
        run: test "$FILESYSTEM_RESULT" = success
      - uses: https://data.forgejo.org/actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.fetchJobs
          GIT_CONFIG_VALUE_0: '8'
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host configuration dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --break-system-packages -r requirements.txt
      - name: Build image and component bundles
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            build_uid=$(id -u nobody)
            build_gid=$(id -g nobody)
            chown -hR "$build_uid:$build_gid" .
            exec setpriv --reuid="$build_uid" --regid="$build_gid" --clear-groups \
              --no-new-privs env HOME=/tmp \
              make -j16 image bundle-kernel bundle-sdk bundle-ports bundle-userspace
          fi
          exec make -j16 image bundle-kernel bundle-sdk bundle-ports bundle-userspace
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-kernel
          path: build/bundles/kernel.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-sdk
          path: build/bundles/sdk.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-userland
          path: build/bundles/userspace.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-ports
          path: build/bundles/ports.tar
          if-no-files-found: error
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-image
          path: |
            build/pyxis.iso
            build/caelum.elf
          if-no-files-found: error
