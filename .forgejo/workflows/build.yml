name: Build Pyxis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BUILDER_IMAGE: git.internal/chronium/pyxis-builder:pyxis-gcc16.2-binutils2.47

jobs:
  kernel:
    runs-on: pyxis
    container:
      image: git.internal/chronium/pyxis-builder:pyxis-gcc16.2-binutils2.47
      credentials:
        username: chronium
        password: ${{ secrets.PYXIS_REGISTRY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PYXIS_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Build kernel bundle
        run: make -j16 bundle-kernel
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-kernel
          path: build/bundles/kernel.tar
          if-no-files-found: error

  sdk:
    runs-on: pyxis
    container:
      image: git.internal/chronium/pyxis-builder:pyxis-gcc16.2-binutils2.47
      credentials:
        username: chronium
        password: ${{ secrets.PYXIS_REGISTRY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PYXIS_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Build sdk bundle
        run: make -j16 bundle-sdk
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-sdk
          path: build/bundles/sdk.tar
          if-no-files-found: error

  userland:
    needs: [sdk, ports]
    runs-on: pyxis
    container:
      image: git.internal/chronium/pyxis-builder:pyxis-gcc16.2-binutils2.47
      credentials:
        username: chronium
        password: ${{ secrets.PYXIS_REGISTRY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PYXIS_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-sdk
          path: build/bundles
      - name: Extract SDK bundle
        run: tar -xf build/bundles/sdk.tar
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-ports
          path: build/bundles
      - name: Extract ports bundle
        run: tar -xf build/bundles/ports.tar
      - name: Build userland bundle
        run: make -j16 bundle-userspace PREBUILT="sdk ports"
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-userland
          path: build/bundles/userspace.tar
          if-no-files-found: error

  ports:
    needs: sdk
    runs-on: pyxis
    container:
      image: git.internal/chronium/pyxis-builder:pyxis-gcc16.2-binutils2.47
      credentials:
        username: chronium
        password: ${{ secrets.PYXIS_REGISTRY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PYXIS_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-sdk
          path: build/bundles
      - name: Extract SDK bundle
        run: tar -xf build/bundles/sdk.tar
      - name: Build ports bundle
        run: make -j16 bundle-ports PREBUILT=sdk
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-ports
          path: build/bundles/ports.tar
          if-no-files-found: error

  image:
    needs: [kernel, sdk, userland, ports]
    runs-on: pyxis
    container:
      image: git.internal/chronium/pyxis-builder:pyxis-gcc16.2-binutils2.47
      credentials:
        username: chronium
        password: ${{ secrets.PYXIS_REGISTRY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.PYXIS_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-kernel
          path: build/bundles
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-sdk
          path: build/bundles
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-userland
          path: build/bundles
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-ports
          path: build/bundles
      - name: Assemble image from bundles
        run: |
          tar -xf build/bundles/kernel.tar
          tar -xf build/bundles/sdk.tar
          tar -xf build/bundles/userspace.tar
          tar -xf build/bundles/ports.tar
          make -j16 image PREBUILT="kernel sdk userspace ports"
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        env:
          NODE_USE_SYSTEM_CA: '1'
        with:
          name: pyxis-image
          path: |
            build/pyxis.iso
            build/caelum.elf
          if-no-files-found: error
